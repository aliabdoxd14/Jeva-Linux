[package]
name = "jeva"
version = "1.0.2"
description = "Jeva — a refined media client for Jellyfin, Emby and Plex"
authors = ["Min Kim", "aliabdoxd14"]
license = "MIT"
repository = "https://github.com/aliabdoxd14/Jeva-Linux"
edition = "2021"
rust-version = "1.77"

# The upstream Windows build ships its version as "1.0.0"; keep the crate
# version in lock-step so the generated package filenames line up.
[lib]
name = "jeva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri build` to enable custom protocol handling on Windows.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
