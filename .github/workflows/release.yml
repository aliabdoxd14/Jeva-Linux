name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-bin \
            patchelf \
            rpm \
            fuse3

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync the web UI from upstream
        # `upstream-dist/` is generated (and git-ignored): the upstream project
        # only ships a closed-source Windows build, so the web UI is recovered
        # from the official release on every build.
        run: npm run sync

      - name: Install npm dependencies
        run: npm ci

      - name: Generate application icons
        run: |
          rsvg-convert -w 1024 -h 1024 icon.svg -o /tmp/icon.png
          npx tauri icon /tmp/icon.png

      - name: Build deb, rpm and AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find src-tauri/target/release/bundle -maxdepth 3 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jeva-linux
          path: artifacts/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Jeva for Linux — ${{ github.ref_name }}

            | Format | File |
            | ------ | ---- |
            | Debian / Ubuntu | `*.deb` |
            | Fedora / openSUSE | `*.rpm` |
            | Universal | `*.AppImage` |
